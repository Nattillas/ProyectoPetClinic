# Test Data Configuration for Cucumber Tests

# API Configuration
api.base.url=http://localhost:8080/petclinic
api.timeout=30
api.retry.attempts=3

# Test Environment Configuration
test.environment=local
test.browser=chrome
test.headless=true

# Logging Configuration
logging.level.com.petclinic.cucumber=DEBUG
logging.level.io.restassured=INFO

# Test Data
test.pet.types=cat,dog,bird,hamster,snake,lizard
test.default.pet.name=TestPet
test.default.owner.firstName=John
test.default.owner.lastName=Doe
test.default.owner.address=123 Test Street
test.default.owner.city=Test City
test.default.owner.telephone=555-1234

# Test Execution Configuration
cucumber.execution.parallel=false
cucumber.execution.thread.count=4
cucumber.glue=com.petclinic.cucumber.stepdefinitions
cucumber.features=classpath:features